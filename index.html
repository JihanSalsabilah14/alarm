<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>alarm anti maling</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(135deg, #0f172a, #020617);
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        transition: 0.3s;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      .subtitle {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 20px;
      }

      .status {
        margin: 16px 0;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        transition: 0.3s;
      }
      .status.off {
        background: rgba(239, 68, 68, 0.15);
        color: #fecaca;
        border: 1px solid rgba(239, 68, 68, 0.4);
      }
      .status.on {
        background: rgba(34, 197, 94, 0.15);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.4);
      }

      button {
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        border: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }
      button.enable {
        background: linear-gradient(135deg, #fb7185, #f97316);
        color: #020617;
      }
      button.enabled {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #022c22;
        cursor: default;
      }

      .motion-box {
        margin-top: 20px;
        height: 120px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: 0.2s;
      }
      .motion-box.active {
        background: rgba(251, 113, 133, 0.25);
        transform: scale(1.03);
      }
      .hint {
        margin-top: 16px;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>📱alarm anti maling</h1>
        <div class="subtitle">Shake / miring = bunyi</div>

        <div id="status" class="status off">Status: ❌ Belum Aktif</div>
        <button id="enableBtn" class="enable">Aktifkan Sensor</button>

        <div id="motionBox" class="motion-box">Menunggu gerakan...</div>
        <div class="hint">
          Buka di HP, klik tombol, lalu gerakkan perangkat.
        </div>
      </div>
    </div>

    <!-- GANTI FILE SESUAI PUNYA KAMU -->
    <audio id="soundShake" src="shake.mp3" preload="auto"></audio>
    <audio id="soundLeft" src="left.mp3" preload="auto"></audio>
    <audio id="soundRight" src="right.mp3" preload="auto"></audio>
    <audio id="soundTilt" src="tilt.mp3" preload="auto"></audio>

    <script>
      const enableBtn = document.getElementById("enableBtn");
      const statusEl = document.getElementById("status");
      const motionBox = document.getElementById("motionBox");

      const soundShake = document.getElementById("soundShake");
      const soundLeft = document.getElementById("soundLeft");
      const soundRight = document.getElementById("soundRight");
      const soundTilt = document.getElementById("soundTilt");

      let lastX = null,
        lastY = null,
        lastZ = null;
      let enabled = false;
      let lastPlay = 0;

      function playSound(audio, label, volume = 1) {
        const now = Date.now();
        if (now - lastPlay < 300) return; // anti spam
        lastPlay = now;

        audio.volume = Math.min(Math.max(volume, 0), 1);
        audio.currentTime = 0;
        audio.play();

        motionBox.classList.add("active");
        motionBox.textContent = label;
        setTimeout(() => {
          motionBox.classList.remove("active");
          motionBox.textContent = "Menunggu gerakan...";
        }, 300);
      }

      enableBtn.addEventListener("click", async () => {
        if (enabled) return;

        // iOS permission
        if (
          typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function"
        ) {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== "granted") {
            alert("Izin sensor ditolak");
            return;
          }
        }

        enabled = true;

        // Update UI
        statusEl.textContent = "Status: ✅ Aktif";
        statusEl.classList.remove("off");
        statusEl.classList.add("on");
        enableBtn.textContent = "Sensor Aktif ✅";
        enableBtn.classList.remove("enable");
        enableBtn.classList.add("enabled");

        // Deteksi shake
        window.addEventListener("devicemotion", (event) => {
          const acc = event.accelerationIncludingGravity;
          if (!acc) return;

          const { x, y, z } = acc;
          if (lastX !== null) {
            const delta =
              Math.abs(x - lastX) + Math.abs(y - lastY) + Math.abs(z - lastZ);

            if (delta > 18) {
              const volume = Math.min(delta / 40, 1);
              playSound(soundShake, "💥 SHAKE!", volume);
            }
          }
          lastX = x;
          lastY = y;
          lastZ = z;
        });

        // Deteksi miring / tilt
        window.addEventListener("deviceorientation", (event) => {
          const { gamma, beta } = event; // kiri-kanan, depan-belakang

          if (gamma > 20) {
            playSound(
              soundRight,
              "👉 MIRING KANAN",
              Math.min(Math.abs(gamma) / 45, 1),
            );
          } else if (gamma < -20) {
            playSound(
              soundLeft,
              "👈 MIRING KIRI",
              Math.min(Math.abs(gamma) / 45, 1),
            );
          } else if (beta > 25 || beta < -25) {
            playSound(
              soundTilt,
              "🔄 TILT DEPAN/BELAKANG",
              Math.min(Math.abs(beta) / 90, 1),
            );
          }
        });
      });
    </script>
  </body>
</html>
